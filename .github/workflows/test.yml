# CI TIDAK menjalankan suite uji. Suite dijalankan di mesin dev, sebelum push.
#
# KENAPA. Suite ini memerlukan gateway tiruan, HOME sekali pakai, dan beberapa
# menit; menjalankannya dua kali -- sekali di mesin dev, sekali lagi di runner --
# membeli kepastian yang sama dua kali. Yang tersisa untuk CI adalah yang TIDAK
# bisa dipastikan dari mesin dev:
#
#   1. bahwa pohon yang BENAR-BENAR terkirim mengurai (bukan pohon lokal yang
#      mungkin berbeda dari yang di-push),
#   2. bahwa checklist ujinya menyebut SETIAP berkas uji yang ada di repo,
#   3. PowerShell, yang tidak ada di mesin dev mana pun di tim ini.
#
# Yang menahan kode merah sampai ke origin adalah `scripts/hooks/pre-push`.
# Checklist di bawah adalah sambungannya: ia ditanam ke pesan commit oleh
# `scripts/pr.sh`, ikut menjadi body PR lewat isian otomatis GitHub, dan dibaca
# dari sana. Satu berkas uji baru yang tidak pernah dijalankan karena itu tidak
# bisa lolos diam-diam -- ia absen dari checklist, dan job ini menyebut namanya.
#
# Yang TIDAK dibuktikan job ini, dan jangan dianggap sebaliknya: bahwa ujinya
# benar-benar lulus. Ia membuktikan KECOCOKAN antara checklist dan isi repo.
# Yang membuktikan lulus adalah hook pre-push, di mesin yang menjalankannya.
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Periksa sintaks bash
        run: |
          for f in setup.sh scripts/setup-dev.sh scripts/setup-pi.sh \
                   scripts/lib/*.sh scripts/hooks/* test/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || exit 1
          done

      - name: Checklist uji menyebut setiap berkas uji
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # Lewat env, BUKAN ${{ }} di dalam skrip: body PR ditulis manusia mana
          # pun yang bisa membuka PR, dan menempelkannya ke badan skrip adalah
          # injeksi perintah, bukan pemeriksaan.
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          printf '%s\n' "$BODY" > /tmp/body.txt
          kurang=""; merah=""; hantu=""
          for f in test/test-*.sh; do
            [ -f "$f" ] || continue
            if grep -qE "^- \[!\] ${f} " /tmp/body.txt; then merah="$merah $f"; continue; fi
            grep -qE "^- \[[x ]\] ${f} " /tmp/body.txt || kurang="$kurang $f"
          done
          # Baris yang mengaku menjalankan berkas yang tidak ada: checklist basi,
          # disalin dari PR lain, atau berkas ujinya dihapus tanpa memperbarui.
          while read -r nama; do
            [ -n "$nama" ] || continue
            [ -f "$nama" ] || hantu="$hantu $nama"
          done < <(sed -nE 's/^- \[[x !]\] (test\/[^ ]+) .*/\1/p' /tmp/body.txt)

          rc=0
          if [ -n "$kurang" ]; then
            echo "::error::Checklist uji tidak menyebut:$kurang"
            rc=1
          fi
          if [ -n "$merah" ]; then
            echo "::error::Checklist menandai uji MERAH:$merah"
            rc=1
          fi
          if [ -n "$hantu" ]; then
            echo "::error::Checklist menyebut berkas yang tidak ada:$hantu"
            rc=1
          fi
          if [ "$rc" -ne 0 ]; then
            cat <<'PESAN'

          Body PR ini berasal dari pesan commit (isian otomatis GitHub), dan
          checklistnya ditanam ke sana oleh scripts/pr.sh saat ia menjalankan
          suite. Jalankan ulang:

              ./scripts/pr.sh

          Ia menjalankan suite, memperbarui checklist di pesan commit, lalu
          mem-push. Body PR ikut diperbarui dengan sendirinya.
          PESAN
            exit 1
          fi
          echo "OK — checklist menyebut setiap berkas uji, tidak ada yang merah."

  # Sintaks PowerShell TIDAK dapat diperiksa dari runner Linux, dan
  # menghitung kurung BUKAN parser. Terbukti 4 September 2026:
  # scripts/lib/PiModels.ps1 punya kurung yang seimbang sempurna tetapi
  # gagal di-parse karena satu pemanggilan perintah dipecah ke baris
  # berikutnya tanpa backtick. Seluruh berkas ikut gagal, sehingga
  # setup.ps1 mati untuk SETIAP dev Windows -- apa pun harness yang
  # dipilihnya -- dan baru ketahuan sesudah v1.4.0 terbit.
  #
  # Job ini memakai Windows PowerShell 5.1 (bukan pwsh 7) karena 5.1 yang
  # menjadi target kompatibilitas repo ini; sintaks yang diterima 7 belum
  # tentu diterima 5.1.
  ps-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse seluruh berkas .ps1 dengan parser PowerShell 5.1
        shell: powershell
        run: |
          $failed = @()
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
              $errs = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $f.FullName, [ref]$null, [ref]$errs)
              if ($errs -and $errs.Count -gt 0) {
                  $failed += $f.FullName
                  Write-Host ("GAGAL: " + $f.FullName)
                  foreach ($e in $errs) {
                      Write-Host ("  baris {0}: {1}" -f $e.Extent.StartLineNumber, $e.Message)
                  }
              } else {
                  Write-Host ("ok: " + $f.FullName)
              }
          }
          if ($failed.Count -gt 0) {
              Write-Host ""
              Write-Host ("{0} berkas .ps1 tidak dapat di-parse." -f $failed.Count)
              exit 1
          }

      # Parser membuktikan berkasnya SAH; ia tidak membuktikan fungsinya bekerja.
      # Cacat kedua di Windows lolos justru karena PowerShell membongkar array
      # satu elemen saat sebuah fungsi me-return-kannya -- perilaku yang tidak
      # punya padanan di bash, sehingga tidak ada uji Linux yang bisa
      # menangkapnya. Uji ini menjalankan merge-nya sungguhan.
      - name: Uji runtime PiModels (merge tanpa jaringan)
        shell: powershell
        run: .\test\Test-PiModels.ps1
