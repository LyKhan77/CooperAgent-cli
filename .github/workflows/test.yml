# Uji berjalan pada setiap PR dan setiap push ke main.
#
# KENAPA: AGENTS.md meminta uji dijalankan sebelum menutup pekerjaan, tapi
# permintaan bukan penjaga. Rilis ditentukan otomatis dari pesan commit, jadi
# kode yang rusak bisa masuk main dan langsung menjadi kandidat rilis.
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Periksa sintaks bash
        run: |
          for f in setup.sh scripts/setup-dev.sh scripts/setup-pi.sh scripts/lib/*.sh test/*.sh; do
            bash -n "$f" || exit 1
          done

      # Ketiga uji ini memakai mode manual (pilihan 4) atau tidak memanggil
      # setup.sh sama sekali, jadi tidak ada agent pihak ketiga yang diunduh.
      # Masing-masing menyalakan gateway tiruannya sendiri dan bekerja di HOME
      # sekali pakai, jadi tidak ada yang perlu dijangkau dari runner.
      - name: Kontrak diambil dari gateway
        run: bash test/test-contract-from-gateway.sh

      - name: Keluaran terbaca di berkas dan konsol non-UTF-8
        run: bash test/test-cli-output.sh

      - name: Setup tidak menyentuh milik dev
        run: bash test/test-setup-preserves-dev-config.sh

      - name: models.yml omp membawa token, bukan identitas
        run: bash test/test-omp-api-key.sh

      - name: Gerbang kredensial berhenti dengan sebabnya
        run: bash test/test-credential-gate.sh

      - name: Retensi cadangan .bak hanya menyentuh miliknya sendiri
        run: bash test/test-bak-retention.sh

      # Menguji skrip yang BENAR-BENAR dijalankan pr-title.yml, bukan salinan
      # polanya: dua kebenaran yang harus dijaga sinkron dengan tangan adalah
      # persis penyakit yang sedang dijaga pagar itu.
      - name: Pagar judul PR menolak prefiks conventional-commit
        run: |
          python3 -m pip install --quiet pyyaml
          bash test/test-pr-title-guard.sh

      # test-setup-dev.sh SENGAJA TIDAK dijalankan di sini.
      #
      # Ia memilih agent omp, sehingga setup.sh mencoba memasangnya dengan
      # mengunduh biner dari internet. Itu lambat, mudah goyah, dan bukan yang
      # sedang diuji.
      #
      # PERBAIKANNYA, bila ada yang mengerjakannya: beri setup.sh penjaga
      # lingkungan COOPERAGENT_NO_INSTALL=1 yang melewati pemasangan agent dan
      # hanya menulis config. Itu juga berguna di luar CI -- dev yang cuma ingin
      # memperbarui parameter tidak perlu dipaksa memasang apa pun.
      # Setelah itu, tambahkan langkahnya di sini.
      #
      # Sampai saat itu ia dijalankan dengan tangan:
      #     bash test/test-setup-dev.sh

  # Sintaks PowerShell TIDAK dapat diperiksa dari runner Linux, dan
  # menghitung kurung BUKAN parser. Terbukti 4 September 2026:
  # scripts/lib/PiModels.ps1 punya kurung yang seimbang sempurna tetapi
  # gagal di-parse karena satu pemanggilan perintah dipecah ke baris
  # berikutnya tanpa backtick. Seluruh berkas ikut gagal, sehingga
  # setup.ps1 mati untuk SETIAP dev Windows -- apa pun harness yang
  # dipilihnya -- dan baru ketahuan sesudah v1.4.0 terbit.
  #
  # Job ini memakai Windows PowerShell 5.1 (bukan pwsh 7) karena 5.1 yang
  # menjadi target kompatibilitas repo ini; sintaks yang diterima 7 belum
  # tentu diterima 5.1.
  ps-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse seluruh berkas .ps1 dengan parser PowerShell 5.1
        shell: powershell
        run: |
          $failed = @()
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
              $errs = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $f.FullName, [ref]$null, [ref]$errs)
              if ($errs -and $errs.Count -gt 0) {
                  $failed += $f.FullName
                  Write-Host ("GAGAL: " + $f.FullName)
                  foreach ($e in $errs) {
                      Write-Host ("  baris {0}: {1}" -f $e.Extent.StartLineNumber, $e.Message)
                  }
              } else {
                  Write-Host ("ok: " + $f.FullName)
              }
          }
          if ($failed.Count -gt 0) {
              Write-Host ""
              Write-Host ("{0} berkas .ps1 tidak dapat di-parse." -f $failed.Count)
              exit 1
          }

      # Parser membuktikan berkasnya SAH; ia tidak membuktikan fungsinya bekerja.
      # Cacat kedua di Windows lolos justru karena PowerShell membongkar array
      # satu elemen saat sebuah fungsi me-return-kannya -- perilaku yang tidak
      # punya padanan di bash, sehingga tidak ada uji Linux yang bisa
      # menangkapnya. Uji ini menjalankan merge-nya sungguhan.
      - name: Uji runtime PiModels (merge tanpa jaringan)
        shell: powershell
        run: .\test\Test-PiModels.ps1
