# Judul PR HARUS berawalan prefiks conventional-commit.
#
# KENAPA ADA. Repo ini memakai squash merge: GitHub menyusun satu commit di
# `main` yang SUBJEKNYA adalah judul PR. Judul itulah satu-satunya yang dibaca
# release-please. Judul tanpa prefiks berarti release-please tidak melihat
# perubahan apa pun -- tidak ada entri CHANGELOG, tidak ada kenaikan versi, dan
# tidak ada yang merah di layar. Perubahannya terbit tanpa pernah tercatat.
#
# Polaritas pagar ini DIBALIK pada 17 September 2026. Sebelumnya repo memakai
# merge commit, dan aturannya justru terbalik: judul conventional dilarang,
# karena GitHub menaruhnya di badan merge commit dan release-please membacanya
# sebagai commit KEDUA -- entri yang sama terbit dua kali. Alasan pindah ke
# squash ada di docs/versioning.md; ringkasnya, di bawah merge commit isian
# otomatis GitHub selalu salah, sedangkan di bawah squash ia selalu benar.
#
# Jebakan yang tersisa hanya satu, dan ini yang dijaga di sini: bila branch
# berisi DUA commit atau lebih, GitHub mengisi judul PR dari NAMA BRANCH, yang
# tentu tidak conventional. Satu commit per branch = isian otomatisnya sudah
# benar dan tidak ada yang perlu diketik.
name: judul-pr

on:
  pull_request:
    # `edited` WAJIB ada. Tanpanya, judul yang diperbaiki sesudah PR dibuat
    # tidak pernah diperiksa ulang, dan cek merah menggantung selamanya pada
    # judul yang sudah benar.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  periksa:
    runs-on: ubuntu-latest
    # PR milik release-please dilewati. Judulnya memang sudah conventional
    # (`chore(main): release X`), jadi pagar ini akan meloloskannya -- tetapi
    # pengecualiannya dipertahankan supaya tidak ada versi pagar ini yang
    # pernah bisa memblokir sebuah rilis.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Judul berawalan prefiks conventional-commit
        env:
          # Lewat env, BUKAN ${{ }} langsung di dalam skrip. Judul PR ditulis
          # oleh manusia mana pun yang bisa membuka PR; menempelkannya ke badan
          # skrip adalah injeksi perintah, bukan pemeriksaan.
          JUDUL: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail
          printf '%s\n' "$JUDUL" > /tmp/judul.txt
          echo "judul: $JUDUL"
          # Dicocokkan dari berkas, bukan lewat pipa: `printf | grep -q` di
          # bawah pipefail mengirim SIGPIPE ke printf dan menghasilkan rc 141
          # justru KETIKA polanya ketemu. Kelas galat itu sudah menggigit repo
          # sebelah dan tidak perlu diulang di sini.
          if ! grep -qE '^(feat|fix|docs|chore|refactor|perf|test|build|ci|style|revert)(\([^)]*\))?!?:' /tmp/judul.txt; then
            echo "::error::Judul PR tidak berawalan prefiks conventional-commit."
            cat <<'PESAN'

          Repo ini memakai squash merge: judul PR ini menjadi SUBJEK commit di
          `main`, dan itulah satu-satunya yang dibaca release-please. Tanpa
          prefiks, perubahan ini terbit tanpa entri CHANGELOG dan tanpa
          kenaikan versi -- diam-diam, karena tidak ada yang gagal.

          Pakai prefiks yang sesuai jenis perubahannya:

              Cadangan .bak tidak lagi menumpuk   ->  fix(setup): retensi cadangan .bak
              Satu pintu menuju produksi          ->  feat(setup): satu pintu menuju produksi

          Bila branch Anda berisi TEPAT SATU commit, GitHub sudah mengisi judul
          ini dari subjek commit tersebut dan tidak ada yang perlu diketik. Yang
          Anda lihat sekarang berarti branch ini berisi dua commit atau lebih,
          dan judulnya terisi dari NAMA BRANCH -- perbaiki judulnya, atau
          gabungkan commit-nya menjadi satu.

          Selengkapnya: docs/versioning.md
          PESAN
            exit 1
          fi
          echo "OK — release-please akan melihat perubahan ini."
