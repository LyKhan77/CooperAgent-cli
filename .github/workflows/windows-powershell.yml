# Satu-satunya yang berjalan di GitHub: parser PowerShell 5.1.
#
# KENAPA HANYA INI. Pada 17 September 2026 seluruh gerbang lain dilepas -- pagar
# judul PR, validator checklist, dan release-please. Semuanya dibangun untuk
# menambal satu kepekaan: release-please membaca badan merge commit, sehingga
# judul PR bisa menggandakan entri CHANGELOG. Tanpa release-please, tidak ada
# satu pun dari aturan itu yang punya alasan untuk ada.
#
# Job ini tinggal karena alasannya lain sama sekali, dan tidak berubah: TIDAK ADA
# PowerShell di mesin dev mana pun di tim ini. Menghitung kurung bukan parser --
# terbukti 4 September 2026, scripts/lib/PiModels.ps1 punya kurung seimbang
# sempurna tetapi gagal di-parse karena satu pemanggilan dipecah ke baris
# berikutnya tanpa backtick. Seluruh berkas ikut gagal, setup.ps1 mati untuk
# SETIAP dev Windows, dan baru ketahuan sesudah v1.4.0 terbit.
#
# Ia tidak menuntut apa pun dari siapa pun: tidak ada judul yang harus berbentuk
# tertentu, tidak ada checklist yang harus diisi. Ia hanya memberi tahu bila
# .ps1 rusak.
#
# Suite bash dijalankan di mesin dev oleh scripts/hooks/pre-push, bukan di sini.
name: windows-powershell

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Sintaks PowerShell TIDAK dapat diperiksa dari runner Linux, dan
  # menghitung kurung BUKAN parser. Terbukti 4 September 2026:
  # scripts/lib/PiModels.ps1 punya kurung yang seimbang sempurna tetapi
  # gagal di-parse karena satu pemanggilan perintah dipecah ke baris
  # berikutnya tanpa backtick. Seluruh berkas ikut gagal, sehingga
  # setup.ps1 mati untuk SETIAP dev Windows -- apa pun harness yang
  # dipilihnya -- dan baru ketahuan sesudah v1.4.0 terbit.
  #
  # Job ini memakai Windows PowerShell 5.1 (bukan pwsh 7) karena 5.1 yang
  # menjadi target kompatibilitas repo ini; sintaks yang diterima 7 belum
  # tentu diterima 5.1.
  ps-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse seluruh berkas .ps1 dengan parser PowerShell 5.1
        shell: powershell
        run: |
          $failed = @()
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
              $errs = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $f.FullName, [ref]$null, [ref]$errs)
              if ($errs -and $errs.Count -gt 0) {
                  $failed += $f.FullName
                  Write-Host ("GAGAL: " + $f.FullName)
                  foreach ($e in $errs) {
                      Write-Host ("  baris {0}: {1}" -f $e.Extent.StartLineNumber, $e.Message)
                  }
              } else {
                  Write-Host ("ok: " + $f.FullName)
              }
          }
          if ($failed.Count -gt 0) {
              Write-Host ""
              Write-Host ("{0} berkas .ps1 tidak dapat di-parse." -f $failed.Count)
              exit 1
          }

      # Parser membuktikan berkasnya SAH; ia tidak membuktikan fungsinya bekerja.
      # Cacat kedua di Windows lolos justru karena PowerShell membongkar array
      # satu elemen saat sebuah fungsi me-return-kannya -- perilaku yang tidak
      # punya padanan di bash, sehingga tidak ada uji Linux yang bisa
      # menangkapnya. Uji ini menjalankan merge-nya sungguhan.
      - name: Uji runtime PiModels (merge tanpa jaringan)
        shell: powershell
        run: .\test\Test-PiModels.ps1
