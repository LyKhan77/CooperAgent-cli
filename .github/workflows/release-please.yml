# Rilis otomatis dari Conventional Commits.
#
# Setiap push ke main, release-please membuka (atau memperbarui) satu PR rilis
# berisi CHANGELOG dan kenaikan versi. PR itu DIRANCANG untuk dibiarkan terbuka
# dan menumpuk: ia memperbarui dirinya sendiri setiap kali ada yang masuk main.
# Merge PR itu = menerbitkan rilis dan tag.
#
# Ia dibuka sebagai DRAFT (`draft-pull-request` di release-please-config.json),
# jadi tombol merge-nya mati sampai seseorang menekan "Ready for review".
#
# KENAPA. Pada 5 September 2026 PR rilis di-merge lima kali berturut-turut untuk
# lima perubahan kecil, menghasilkan tiga tag di repo ini dan dua di repo server
# untuk satu rencana yang sama. Sebabnya bukan salah paham: PR rilis yang
# terlihat siap merge memang tampak seperti pekerjaan yang belum selesai.
#
# Draft membalik bawaannya. Diamkan = benar. Menerbitkan menuntut satu tindakan
# sadar: Ready for review, lalu merge. Itulah cara menyatakan "rencana selesai".
#
# GITHUB_TOKEN disediakan otomatis oleh GitHub, jadi tidak ada rahasia yang perlu
# disimpan -- sejalan dengan aturan repo ini bahwa tidak ada rahasia di sini.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # release-please menyentuh issue saat menautkan PR rilis ke commit; tanpa ini
  # sebagian jalurnya gagal meski contents/pull-requests sudah write.
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
