# Provider CooperAgent untuk Oh My Pi.
#
# EMPAT profil, sama persis dengan Grok dan pi. Sampai 12 September 2026 setiap
# harness memakai kosakata sendiri — Grok `internal-qwen*`, omp `cooperagent*`,
# dan pi hanya punya satu dari tiga. Dev yang berpindah harness harus menghafal
# nama berbeda untuk hal yang sama.
#
# Keempatnya dibedakan oleh SATU hal: siapa yang memilih server.
#
#   cooper-agent  gateway yang memilih, dengan failover
#   cooper-s1     dipaksa ke server 1, tanpa failover
#   cooper-s2     dipaksa ke server 2, tanpa failover
#   cooper-s3     dipaksa ke server 3, tanpa failover
#
# ALAMAT bukan bagian dari pilihan ini. LAN, VPN, dan localhost adalah pertanyaan
# lain — dijawab sekali saat setup lewat `--endpoint lan|vpn|local`, dan
# alamatnya datang dari kontrak gateway, bukan dari tabel di repo ini.
#
# Berkas ini DIRENDER oleh skrip setup. `__GATEWAY__` dan `__API_KEY__` diganti
# dengan alamat serta identitas dev; `__MODEL_ID__`, `__CONTEXT_WINDOW__`, dan
# `__MAX_TOKENS__` DIAMBIL dari `/v1/models` gateway saat render.
#
# Sampai 1 September 2026 ketiganya ditulis tangan di sini — dan `id:` masih
# berbunyi `qwen35` berbulan-bulan setelah alias mesin berganti menjadi
# `intercon-agent`. Itu tidak memutus apa pun hanya karena llama-server
# mengabaikan field `model` sepenuhnya; ia tetap contoh persis dari penyimpangan
# yang `/v1/models` ada untuk mencegah.
#
# Sesudah terpasang, provider yang SUDAH ada tidak pernah ditimpa — dev boleh
# menyunting endpoint dan menambah provider sendiri. Yang HILANG ditambahkan,
# supaya profil baru tetap sampai. Lihat scripts/lib/merge_providers.sh.
providers:
  # Sehari-hari. Gateway yang memilih server; failover otomatis bila satu node
  # penuh atau mati.
  cooper-agent:
    name: CooperAgent (routing otomatis)
    baseUrl: __GATEWAY__/v1
    apiKey: __API_KEY__
    api: openai-completions
    models:
      - id: __MODEL_ID__
        name: CooperAgent — routing otomatis
        contextWindow: __CONTEXT_WINDOW__
        maxTokens: __MAX_TOKENS__
        # Kedua node memuat mmproj; tanpa baris ini omp memperlakukan model ini
        # sebagai teks saja (`supportsImages === true`, dan tidak ada bawaan).
        supportsImages: true

  # ALAT PEMBANDING, bukan jalur harian. Menembus routing langsung ke server 1.
  #
  # Sesi yang memakainya KEHILANGAN failover: bila server 1 penuh ia mengantre,
  # bila mati request-nya gagal — tidak berpindah ke node lain.
  cooper-s1:
    name: CooperAgent server 1 (langsung)
    baseUrl: __GATEWAY__/v1/upstream/s1
    apiKey: __API_KEY__
    api: openai-completions
    models:
      - id: __MODEL_ID__
        name: CooperAgent @ s1 — tanpa failover
        contextWindow: __CONTEXT_WINDOW__
        maxTokens: __MAX_TOKENS__
        # Kedua node memuat mmproj; tanpa baris ini omp memperlakukan model ini
        # sebagai teks saja (`supportsImages === true`, dan tidak ada bawaan).
        supportsImages: true

  # Pasangan cooper-s1. Gunanya membandingkan jawaban kedua node pada prompt
  # yang sama — kuantisasi dan drafter keduanya boleh berbeda.
  #
  # Sesi yang memakainya KEHILANGAN failover, sama seperti cooper-s1.
  cooper-s2:
    name: CooperAgent server 2 (langsung)
    baseUrl: __GATEWAY__/v1/upstream/s2
    apiKey: __API_KEY__
    api: openai-completions
    models:
      - id: __MODEL_ID__
        name: CooperAgent @ s2 — tanpa failover
        contextWindow: __CONTEXT_WINDOW__
        maxTokens: __MAX_TOKENS__
        # Kedua node memuat mmproj; tanpa baris ini omp memperlakukan model ini
        # sebagai teks saja (`supportsImages === true`, dan tidak ada bawaan).
        supportsImages: true

  # Pasangan cooper-s1/cooper-s2. Gunanya membandingkan jawaban antar node pada
  # prompt yang sama — kuantisasi dan drafter boleh berbeda di tiap node.
  #
  # Sesi yang memakainya KEHILANGAN failover, sama seperti cooper-s1/cooper-s2.
  cooper-s3:
    name: CooperAgent server 3 (langsung)
    baseUrl: __GATEWAY__/v1/upstream/s3
    apiKey: __API_KEY__
    api: openai-completions
    models:
      - id: __MODEL_ID__
        name: CooperAgent @ s3 — tanpa failover
        contextWindow: __CONTEXT_WINDOW__
        maxTokens: __MAX_TOKENS__
        # Kedua node memuat mmproj; tanpa baris ini omp memperlakukan model ini
        # sebagai teks saja (`supportsImages === true`, dan tidak ada bawaan).
        supportsImages: true
