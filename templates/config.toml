# Kunci config.toml yang DIKELOLA template CooperAgent.
#
# Skrip setup menggabungkan (merge) berkas ini ke ~/.grok/config.toml:
# kunci di bawah ditimpa, kunci lain di mesin dev dibiarkan utuh.
# Karena itu `api_key` TIDAK ada di sini — identitas tiap dev tetap miliknya,
# dan tidak ada kredensial yang masuk ke git (Zero-Secret).
#
# Sunting berkas ini, commit, lalu jalankan ulang skrip setup.
#
# PLACEHOLDER (nama yang diapit dua garis bawah) DIISI SAAT RENDER, tidak
# dipatok di sini. Nilai
# context_window, max_tokens, ambang compaction, dan nama model DIAMBIL dari
# `/v1/models` gateway saat skrip berjalan (lihat scripts/lib/contract.sh).
# Sampai 1 September 2026 keempatnya ditulis tangan di berkas ini, dan karena
# itu tidak pernah tahu ketika --ctx-size server berubah.
#
# Berkas ini TIDAK boleh di-merge mentah-mentah: skrip yang memakainya wajib
# merender lebih dulu dan menolak bila masih ada `__` yang tersisa.

[session]
# Compaction dipicu di __COMPACT_PCT__% dari context_window di bawah
# = __COMPACT_TOKENS__ token.
#
#   __COMPACT_TOKENS__ (picu) + __MAX_TOKENS_FMT__ (jatah jawaban) = __PEAK__ puncak
#   __CONTEXT_WINDOW_FMT__ (plafon slot) - __PEAK__ = __SLACK__ sisa
#
# Bentuk lama menyisihkan jatah keluaran di dalam `context_window` (118.784)
# lalu memakai 90%. Hasilnya setara tetapi sisanya lebih sempit (11.879), dan
# aritmetikanya tersembunyi di dua tempat sekaligus. Sekarang `context_window`
# menyebut ukuran slot yang sebenarnya, dan seluruh bantalan ada di satu angka
# yang bisa dijelaskan tanpa hitungan tambahan.
#
# Bantalan itu bukan kemewahan. Terukur 29 Agustus 2026: satu slot berjalan di
# 121.111 token, melewati ambang lama maupun baru — entah karena perkiraan
# token klien meleset dari tokenizer server, entah karena pemeriksaan hanya
# terjadi di antara giliran. Apa pun sebabnya, sisa __SLACK__ token yang menyerap.
auto_compact_threshold_percent = __COMPACT_PCT__
load_envrc = true

[memory]
enabled = true

[models]
default = "cooper-agent"
stream_tool_calls = true
max_tokens = __MAX_TOKENS__
max_completion_tokens = __MAX_TOKENS__
max_output_tokens = __MAX_TOKENS__

# TIGA profil, nama yang sama di Grok, omp, dan pi.
#
# Sampai 12 September 2026 tiap harness memakai kosakatanya sendiri —
# `internal-qwen*` di sini, `cooperagent*` di omp, dan pi hanya punya satu dari
# tiga. Dev yang berpindah harness harus menghafal nama berbeda untuk hal sama.
#
# Yang membedakan ketiganya hanya SATU hal: siapa yang memilih server.
# ALAMAT bukan bagian dari pilihan ini — LAN/VPN/localhost dijawab sekali saat
# setup lewat `--endpoint`, dan alamatnya datang dari kontrak gateway.

# Sehari-hari. Gateway yang memilih server; failover otomatis.
[model.cooper-agent]
model = "__MODEL_ID__"
# @keep-existing
# Alamat gateway berbeda per jaringan. Penanda di atas membuat baris ini HANYA
# ditulis bila belum ada — alamat yang sudah bekerja di mesin dev tidak pernah
# diubah.
#
# Alamatnya TIDAK ditulis di sini. Sampai 2 September 2026 baris ini memuat IP
# LAN kantor, dan itu yang menghalangi berkas ini pindah ke repo pemasang yang
# publik. `__GATEWAY__` diisi skrip setup dari alamat yang sedang dipakai dev.
base_url = "__GATEWAY__/api/v1"
api_backend = "chat_completions"
# Plafon SATU slot llama-server: --ctx-size dibagi --parallel, sama di kedua
# server. Ditanyakan ke gateway saat render, bukan dipatok: nilainya berubah
# setiap kali --parallel dinaikkan. Bantalannya diatur oleh
# auto_compact_threshold_percent = __COMPACT_PCT__ di [session].
context_window = __CONTEXT_WINDOW__
max_tokens = __MAX_TOKENS__
max_completion_tokens = __MAX_TOKENS__
max_output_tokens = __MAX_TOKENS__

# Menembus routing gateway, langsung ke server 1.
#
# ALAT VERIFIKASI, bukan cara kerja sehari-hari. Sesi yang memakai entri ini
# KEHILANGAN failover: kalau server 1 mati, request-nya gagal alih-alih
# berpindah. Gunanya membandingkan jawaban kedua node pada prompt yang sama.
#
# Sampai 12 September 2026 hanya s2 yang punya entri langsung, sehingga
# perbandingannya berat sebelah — s2 bisa ditembak, s1 tidak.
[model.cooper-s1]
model = "__MODEL_ID__"
# @keep-existing
# Sama seperti cooper-agent: alamat gateway berbeda per jaringan. Tanpa penanda
# ini, dev yang sedang di VPN akan mendapati entrinya dikembalikan ke alamat LAN
# dan berhenti bekerja.
base_url = "__GATEWAY__/api/v1/upstream/s1"
api_backend = "chat_completions"
context_window = __CONTEXT_WINDOW__
max_tokens = __MAX_TOKENS__
max_completion_tokens = __MAX_TOKENS__
max_output_tokens = __MAX_TOKENS__

# Pasangan cooper-s1, langsung ke server 2. KEHILANGAN failover, sama alasannya.
[model.cooper-s2]
model = "__MODEL_ID__"
# @keep-existing
base_url = "__GATEWAY__/api/v1/upstream/s2"
api_backend = "chat_completions"
context_window = __CONTEXT_WINDOW__
max_tokens = __MAX_TOKENS__
max_completion_tokens = __MAX_TOKENS__
max_output_tokens = __MAX_TOKENS__
